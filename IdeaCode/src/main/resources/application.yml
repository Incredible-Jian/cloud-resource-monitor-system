spring:
  mvc:
    static-path-pattern: /**
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mymonitor}?characterEncoding=utf8&useSSL=false&serverTimezone=UTC
  web:
    resources:
      static-locations: classpath:/static/
python:
  api:
    url: ${PYTHON_API_URL:http://localhost:5000}
    predict-endpoint: "/predict"
    current-endpoint: "/current-usage"
server:
  port: 8080
  servlet:
    context-path: /
monitoring:
  ip-block:
    threshold: 50    # 1分钟内访问次数阈值
    duration-hours: 24 # 默认封锁时长(小时)
    log-retention: 60  # 日志保留时间(分钟)
